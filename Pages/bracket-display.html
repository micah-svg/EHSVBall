<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B3D34">
<meta name="robots" content="noindex, nofollow">
<title>Live Bracket — Sophie Montez Memorial Tournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --navy:#0B3D34;
    --bg:#FBF1F5;
    --card:#FFFFFF;
    --ink:#1B2B26;
    --sub:#6E7D77;
    --line:#D9C7CE;
    --win:#1D9A8C;
    --purple:#5B2C8F;
    --teal:#2A9D93;
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; overflow:hidden;
  }
  body{ display:flex; flex-direction:column; }
  h1,h2{ font-family:'Oswald',sans-serif; }

  header{
    background:var(--navy); color:#fff; padding:12px 32px;
    display:flex; align-items:center; gap:20px; flex-shrink:0;
  }
  .qr-block{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .title-block{ flex:1; min-width:0; }
  header h1{ margin:0; font-size:1.8vw; font-weight:600; }
  header .sub{ font-size:1vw; color:#CBA9B2; margin-top:2px; }
  header .updated{ font-size:0.95vw; color:#AEB8B2; text-align:right; white-space:nowrap; flex-shrink:0; }
  header .updated .dot{
    display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--win);
    margin-right:6px; animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }

  .qr-badge{
    position:relative; width:clamp(84px, 7.5vw, 132px); aspect-ratio:1;
    flex-shrink:0; border-radius:50%;
    animation:qrPulseRing 2.4s ease-in-out infinite;
  }
  @keyframes qrPulseRing{
    0%,100%{ box-shadow:0 0 0 0 rgba(232,116,158,0.55); }
    50%{ box-shadow:0 0 0 12px rgba(232,116,158,0); }
  }
  .qr-badge svg{ position:absolute; inset:0; width:100%; height:100%; }
  .qr-badge .qr-code-wrap{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:62%; height:62%; background:#fff; border-radius:8px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,0.3);
  }
  .qr-badge .qr-code-wrap img, .qr-badge .qr-code-wrap canvas, .qr-badge .qr-code-wrap table{
    width:100% !important; height:100% !important;
  }
  .qr-label-main{ font-size:1.05vw; font-weight:700; color:var(--gold); letter-spacing:0.4px; white-space:nowrap; }
  .qr-label-sub{ font-size:0.8vw; color:#CBA9B2; white-space:nowrap; }

  main{
    display:grid; grid-template-columns:1fr 1fr; gap:16px;
    padding:16px; flex:1; min-height:0; overflow:hidden;
  }

  .bracket-panel{
    background:var(--card); border-radius:14px; border:1px solid var(--line);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .bracket-head{
    color:#fff; padding:10px 18px; display:flex; justify-content:space-between; align-items:baseline; flex-shrink:0;
  }
  .bracket-head.purple{ background:var(--purple); }
  .bracket-head.teal{ background:var(--teal); }
  .bracket-head h2{ margin:0; font-size:1.5vw; }
  .bracket-head .court-note{ font-size:0.85vw; opacity:0.85; }

  .empty-msg{ margin:auto; text-align:center; color:var(--sub); font-size:1.1vw; padding:20px; }

  .bracket-tree{ flex:1; display:flex; padding:14px; gap:1.2vw; overflow:hidden; }
  .round{ flex:1; display:flex; flex-direction:column; justify-content:space-around; min-width:0; }
  .pair{ display:flex; flex-direction:column; justify-content:space-around; flex:1; border-right:2px solid var(--line); position:relative; padding-right:1.2vw; margin-right:0; }
  .pair::after{
    content:''; position:absolute; top:50%; right:-1.2vw; width:1.2vw; height:2px; background:var(--line);
  }
  .round.round3 .matchup, .round.round4 .champion-box{ margin:auto 0; position:relative; }
  .round.round3 .matchup::after{
    content:''; position:absolute; top:50%; right:-1.2vw; width:1.2vw; height:2px; background:var(--line);
  }

  .matchup{
    background:var(--bg); border:1px solid var(--line); border-radius:8px; overflow:hidden;
    font-size:0.95vw;
  }
  .team-row{
    padding:5px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    border-bottom:1px solid var(--line); font-weight:600;
  }
  .team-row:last-child{ border-bottom:none; }
  .team-row.bye-row{ color:var(--sub); font-weight:400; font-style:italic; }
  .team-row.tbd-row{ color:var(--sub); font-weight:400; font-style:italic; }
  .matchup-foot{
    text-align:center; font-family:'Oswald'; font-size:0.8vw; padding:3px 4px;
    border-top:1px solid var(--line); background:#fff;
  }
  .matchup-foot.live{ background:#FCE9E9; color:#C0392B; animation:pulse 1.6s ease-in-out infinite; font-weight:700; }
  .matchup-tag{
    font-size:0.7vw; color:var(--sub); text-align:center; margin-bottom:3px;
  }

  .champion-box{
    background:var(--navy); color:#fff; border-radius:10px; padding:14px 10px; text-align:center;
  }
  .champion-box .label{ font-size:0.75vw; text-transform:uppercase; letter-spacing:0.5px; opacity:0.75; }
  .champion-box .name{ font-family:'Oswald'; font-size:1.15vw; margin-top:4px; }
  .champion-box.empty{ background:var(--bg); color:var(--sub); border:1px dashed var(--line); font-style:italic; font-size:0.9vw; }

  .purple-accent .team-row.winner{ color:var(--purple); }
  .teal-accent .team-row.winner{ color:var(--teal); }
</style>
</head>
<body>

<header>
  <div class="qr-block">
    <div class="qr-badge">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="47" fill="#fff" stroke="#E8749E" stroke-width="3"/>
        <path d="M50,4 C24,22 24,78 50,96" fill="none" stroke="#E8749E" stroke-width="2.5"/>
        <path d="M50,4 C76,22 76,78 50,96" fill="none" stroke="#E8749E" stroke-width="2.5"/>
        <path d="M4,50 C28,37 72,37 96,50" fill="none" stroke="#E8749E" stroke-width="2.5"/>
        <path d="M4,50 C28,63 72,63 96,50" fill="none" stroke="#E8749E" stroke-width="2.5"/>
      </svg>
      <div class="qr-code-wrap" id="qrCode"></div>
    </div>
    <div>
      <div class="qr-label-main">SCAN ME</div>
      <div class="qr-label-sub">for live scores</div>
    </div>
  </div>
  <div class="title-block">
    <h1>Sophie Montez Memorial Tournament</h1>
    <div class="sub">Live Bracket Play</div>
  </div>
  <div class="updated"><span class="dot"></span><span id="updatedText">Loading&hellip;</span></div>
</header>

<main id="bracketsGrid"></main>

<script>
const POOLS = [
  { key:'A', court:1, teams:['Estacada','South Umpqua','Banks','Gladstone'] },
  { key:'B', court:2, teams:['Scappoose','Madras','Philomath','La Pine'] },
  { key:'C', court:3, teams:['Ontario','Junction City','Molalla','Astoria'] }
];
const ROUND_PATTERN = [[0,3],[1,2],[0,2],[1,3],[0,1],[2,3]];
const COURT_NAMES = { 1:'EHS Main Gym', 2:'EHS Aux Gym', 3:'River Mill Gym' };
const BRACKET_COURT_PLAN = {
  gold:   { 1:['qfA','sf1','final'], 2:['qfB','sf2'] },
  silver: { 3:['qfA','qfB','sf1','sf2','final'] }
};
const SLOT_COURT = {
  gold:   { qfA:1, qfB:2, sf1:1, sf2:2, final:1 },
  silver: { qfA:3, qfB:3, sf1:3, sf2:3, final:3 }
};
const GAME_ID = { qfA:1, qfB:2, sf1:3, sf2:4, final:5 };

let state = { poolPlayComplete:false, matches:{}, bracketMatches:{ gold:{}, silver:{} } };

function ensureMatch(pool,round){
  const k = pool+'-r'+round;
  if(!state.matches[k]) state.matches[k] = { sets:[{a:null,b:null}], live:false };
  return state.matches[k];
}
function computeMatchResult(m, teamA, teamB){
  let setsA=0,setsB=0;
  (m.sets||[]).forEach(s=>{
    if(s.a!=null && s.b!=null && !isNaN(s.a) && !isNaN(s.b) && (s.a>0||s.b>0)){
      if(s.a>s.b) setsA++; else if(s.b>s.a) setsB++;
    }
  });
  let winner=null;
  if(setsA>setsB) winner=teamA; else if(setsB>setsA) winner=teamB;
  return { setsA,setsB,winner,played: winner!==null };
}
function poolStandings(pool){
  const stats = {};
  pool.teams.forEach(t=> stats[t] = { team:t, wins:0, losses:0, setsW:0, setsL:0, ptsW:0, ptsL:0, h2h:{} });
  ROUND_PATTERN.forEach((pair, idx)=>{
    const round = idx+1;
    const teamA = pool.teams[pair[0]], teamB = pool.teams[pair[1]];
    const m = ensureMatch(pool.key, round);
    const r = computeMatchResult(m, teamA, teamB);
    if(r.played){
      if(r.winner===teamA){ stats[teamA].wins++; stats[teamB].losses++; stats[teamA].h2h[teamB]='W'; stats[teamB].h2h[teamA]='L'; }
      else { stats[teamB].wins++; stats[teamA].losses++; stats[teamB].h2h[teamA]='W'; stats[teamA].h2h[teamB]='L'; }
    }
  });
  const arr = Object.values(stats);
  arr.sort((a,b)=> b.wins-a.wins);
  for(let i=0;i<arr.length-1;i++){
    let j=i;
    while(j+1<arr.length && arr[j+1].wins===arr[i].wins) j++;
    if(j===i+1){
      const a=arr[i], b=arr[j];
      if(a.h2h[b.team]==='L' && b.h2h[a.team]==='W'){ arr[i]=b; arr[j]=a; }
    }
  }
  arr.forEach((s,i)=> s.rank = i+1);
  return arr;
}
function getBracketSeeds(){
  const results = POOLS.map(p=> ({ pool:p.key, standings: poolStandings(p) }));
  const rankGroup = (rankNum)=> results.map(r=> r.standings.find(s=>s.rank===rankNum));
  const gold = [...rankGroup(1), ...rankGroup(2)].map((s,i)=> ({ seed:i+1, team:s.team }));
  const silver = [...rankGroup(3), ...rankGroup(4)].map((s,i)=> ({ seed:i+1, team:s.team }));
  return { gold, silver };
}
function ensureBracketMatchIn(bm, slotKey){
  if(!bm[slotKey]) bm[slotKey] = { sets:[{a:null,b:null}], live:false };
  return bm[slotKey];
}
function bracketStructure(seeds, bm){
  const bySeed = n => seeds.find(s=>s.seed===n)?.team || null;
  const qfA_x = bySeed(4), qfA_y = bySeed(5);
  const qfB_x = bySeed(3), qfB_y = bySeed(6);
  const qfA_m = ensureBracketMatchIn(bm,'qfA'), qfB_m = ensureBracketMatchIn(bm,'qfB');
  const qfA_res = computeMatchResult(qfA_m, qfA_x, qfA_y);
  const qfB_res = computeMatchResult(qfB_m, qfB_x, qfB_y);
  const sf1_x = bySeed(1), sf1_y = qfA_res.winner;
  const sf2_x = bySeed(2), sf2_y = qfB_res.winner;
  const sf1_m = ensureBracketMatchIn(bm,'sf1'), sf2_m = ensureBracketMatchIn(bm,'sf2');
  const sf1_res = computeMatchResult(sf1_m, sf1_x, sf1_y);
  const sf2_res = computeMatchResult(sf2_m, sf2_x, sf2_y);
  const final_m = ensureBracketMatchIn(bm,'final');
  const final_res = computeMatchResult(final_m, sf1_res.winner, sf2_res.winner);
  return {
    qfA:{ x:qfA_x, y:qfA_y, winner:qfA_res.winner, played:qfA_res.played, setsA:qfA_res.setsA, setsB:qfA_res.setsB, m:qfA_m },
    qfB:{ x:qfB_x, y:qfB_y, winner:qfB_res.winner, played:qfB_res.played, setsA:qfB_res.setsA, setsB:qfB_res.setsB, m:qfB_m },
    sf1:{ x:sf1_x, y:sf1_y, winner:sf1_res.winner, played:sf1_res.played, setsA:sf1_res.setsA, setsB:sf1_res.setsB, m:sf1_m },
    sf2:{ x:sf2_x, y:sf2_y, winner:sf2_res.winner, played:sf2_res.played, setsA:sf2_res.setsA, setsB:sf2_res.setsB, m:sf2_m },
    final:{ x:sf1_res.winner, y:sf2_res.winner, winner:final_res.winner, played:final_res.played, setsA:final_res.setsA, setsB:final_res.setsB, m:final_m }
  };
}

// ---------- RENDER ----------
function teamRowHtml(name, isWinner, isBye){
  if(name===null) return '<div class="team-row tbd-row">TBD</div>';
  if(isBye) return '<div class="team-row bye-row">BYE</div>';
  return '<div class="team-row'+(isWinner?' winner':'')+'">'+name+'</div>';
}
function matchupFootHtml(x, y, played, live, setsA, setsB){
  if(x===null || y===null) return '';
  if(played) return '<div class="matchup-foot">'+Math.max(setsA,setsB)+'-'+Math.min(setsA,setsB)+'</div>';
  if(live) return '<div class="matchup-foot live">LIVE</div>';
  return '<div class="matchup-foot">Not played</div>';
}
function gameTag(bKey, slotKey){
  return '<div class="matchup-tag">Game '+GAME_ID[slotKey]+' &middot; '+COURT_NAMES[SLOT_COURT[bKey][slotKey]]+'</div>';
}

function renderBracketPanel(label, colorClass, bKey, seeds){
  const bm = state.bracketMatches[bKey] || {};
  const st = bracketStructure(seeds, bm);
  const courtNote = bKey==='gold' ? COURT_NAMES[1]+' &amp; '+COURT_NAMES[2] : COURT_NAMES[3];

  let html = '<div class="bracket-panel '+colorClass+'-accent">';
  html += '<div class="bracket-head '+colorClass+'"><h2>'+label+'</h2><span class="court-note">'+courtNote+'</span></div>';
  html += '<div class="bracket-tree">';

  html += '<div class="round round1">';
  html += '<div class="pair">';
  html += '<div class="matchup">'+teamRowHtml(seeds.find(s=>s.seed===1)?.team||null, true, false)+teamRowHtml(null,false,true)+'</div>';
  html += '<div class="matchup">'+gameTag(bKey,'qfA')+teamRowHtml(st.qfA.x, st.qfA.winner===st.qfA.x, false)+teamRowHtml(st.qfA.y, st.qfA.winner===st.qfA.y, false)+matchupFootHtml(st.qfA.x, st.qfA.y, st.qfA.played, st.qfA.m.live, st.qfA.setsA, st.qfA.setsB)+'</div>';
  html += '</div>';
  html += '<div class="pair">';
  html += '<div class="matchup">'+gameTag(bKey,'qfB')+teamRowHtml(st.qfB.x, st.qfB.winner===st.qfB.x, false)+teamRowHtml(st.qfB.y, st.qfB.winner===st.qfB.y, false)+matchupFootHtml(st.qfB.x, st.qfB.y, st.qfB.played, st.qfB.m.live, st.qfB.setsA, st.qfB.setsB)+'</div>';
  html += '<div class="matchup">'+teamRowHtml(seeds.find(s=>s.seed===2)?.team||null, true, false)+teamRowHtml(null,false,true)+'</div>';
  html += '</div>';
  html += '</div>';

  html += '<div class="round round2"><div class="pair">';
  html += '<div class="matchup">'+gameTag(bKey,'sf1')+teamRowHtml(st.sf1.x, st.sf1.winner===st.sf1.x, false)+teamRowHtml(st.sf1.y, st.sf1.winner===st.sf1.y, false)+matchupFootHtml(st.sf1.x, st.sf1.y, st.sf1.played, st.sf1.m.live, st.sf1.setsA, st.sf1.setsB)+'</div>';
  html += '<div class="matchup">'+gameTag(bKey,'sf2')+teamRowHtml(st.sf2.x, st.sf2.winner===st.sf2.x, false)+teamRowHtml(st.sf2.y, st.sf2.winner===st.sf2.y, false)+matchupFootHtml(st.sf2.x, st.sf2.y, st.sf2.played, st.sf2.m.live, st.sf2.setsA, st.sf2.setsB)+'</div>';
  html += '</div></div>';

  html += '<div class="round round3">';
  html += '<div class="matchup">'+gameTag(bKey,'final')+teamRowHtml(st.final.x, st.final.winner===st.final.x, false)+teamRowHtml(st.final.y, st.final.winner===st.final.y, false)+matchupFootHtml(st.final.x, st.final.y, st.final.played, st.final.m.live, st.final.setsA, st.final.setsB)+'</div>';
  html += '</div>';

  html += '<div class="round round4">';
  if(st.final.winner){
    html += '<div class="champion-box"><div class="label">Champion</div><div class="name">'+st.final.winner+'</div></div>';
  } else {
    html += '<div class="champion-box empty">TBD</div>';
  }
  html += '</div>';

  html += '</div></div>';
  return html;
}

function render(){
  const grid = document.getElementById('bracketsGrid');
  if(!state.poolPlayComplete){
    grid.innerHTML = '<div class="bracket-panel"><div class="empty-msg">Waiting for pool play to be marked complete&hellip; brackets will appear here automatically.</div></div>'.repeat(2);
    return;
  }
  const { gold, silver } = getBracketSeeds();
  grid.innerHTML =
    renderBracketPanel('Purple Bracket', 'purple', 'gold', gold) +
    renderBracketPanel('Teal Bracket', 'teal', 'silver', silver);
}

function setUpdatedNow(){
  const el = document.getElementById('updatedText');
  const now = new Date();
  el.textContent = 'Updated ' + now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

let lastSnapshot = null;
async function pollData(){
  try{
    const res = await window.storage.get('tournament-data', true);
    if(res && res.value && res.value !== lastSnapshot){
      lastSnapshot = res.value;
      const parsed = JSON.parse(res.value);
      if(parsed.matches) state.matches = parsed.matches;
      if(parsed.bracketMatches) state.bracketMatches = parsed.bracketMatches;
      if(typeof parsed.poolPlayComplete === 'boolean') state.poolPlayComplete = parsed.poolPlayComplete;
      render();
    }
    setUpdatedNow();
  }catch(e){ /* keep showing the last good data */ }
}

new QRCode(document.getElementById('qrCode'), {
  text: 'https://ehsvball.netlify.app/',
  width: 180,
  height: 180,
  colorDark: '#E8749E',
  colorLight: '#ffffff',
  correctLevel: QRCode.CorrectLevel.H
});

(async function init(){
  render();
  await pollData();
  setInterval(pollData, 5000);
})();
</script>
</body>
</html>
