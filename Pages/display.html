<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B3D34">
<meta name="robots" content="noindex, nofollow">
<title>Live Pools — Sophie Montez Memorial Tournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  // --- Shared live-score storage, backed by Firebase Realtime Database ---
  // Paste your project's config below (Firebase console > Project settings > General >
  // "Your apps" > SDK setup and configuration > Config). This same object goes in all
  // four files (tournament.html, scorekeeper.html, display.html, bracket-display.html).
  const firebaseConfig = {
    apiKey: "AIzaSyAX7YxKGh99GrBnyRftb0NL_wtL0bt7WXI",
    authDomain: "ehs-volleyball.firebaseapp.com",
    databaseURL: "https://ehs-volleyball-default-rtdb.firebaseio.com",
    projectId: "ehs-volleyball",
    storageBucket: "ehs-volleyball.firebasestorage.app",
    messagingSenderId: "957400589340",
    appId: "1:957400589340:web:32fa39dd4e23b69859ebd9"
  };
  let _fbDb = null;
  try{
    firebase.initializeApp(firebaseConfig);
    _fbDb = firebase.database();
  }catch(e){ console.error('Firebase init failed — check firebaseConfig at the top of this file', e); }

  // Drop-in replacement for the old sandbox-only window.storage API. Nothing else in this
  // file needs to change: .get/.set/.delete keep the exact same shape as before.
  // Personal (shared:false) keys stay in this browser's localStorage.
  // Shared (shared:true) keys sync live to every device through Firebase.
  window.storage = {
    async get(key, shared){
      if(!shared){
        const v = localStorage.getItem(key);
        return v !== null ? { key, value:v, shared:false } : null;
      }
      if(!_fbDb) return null;
      try{
        const snap = await _fbDb.ref('shared/'+key).once('value');
        const v = snap.val();
        return (v!==null && v!==undefined) ? { key, value:v, shared:true } : null;
      }catch(e){ return null; }
    },
    async set(key, value, shared){
      if(!shared){
        localStorage.setItem(key, value);
        return { key, value, shared:false };
      }
      if(!_fbDb) return null;
      try{
        await _fbDb.ref('shared/'+key).set(value);
        return { key, value, shared:true };
      }catch(e){ return null; }
    },
    async delete(key, shared){
      if(!shared){ localStorage.removeItem(key); return { key, deleted:true, shared:false }; }
      if(!_fbDb) return null;
      try{ await _fbDb.ref('shared/'+key).remove(); return { key, deleted:true, shared:true }; }
      catch(e){ return null; }
    },
    async list(prefix, shared){
      return { keys: [], prefix, shared: !!shared };
    }
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --navy:#0B3D34;
    --gold:#E8749E;
    --bg:#FBF1F5;
    --card:#FFFFFF;
    --ink:#1B2B26;
    --sub:#6E7D77;
    --line:#EADBE0;
    --win:#1D9A8C;
    --pending:#A79AA0;
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; overflow:hidden;
  }
  body{ display:flex; flex-direction:column; }
  h1,h2,h3{ font-family:'Oswald',sans-serif; }

  header{
    background:var(--navy); color:#fff; padding:14px 32px;
    display:flex; align-items:center; gap:22px; flex-shrink:0;
  }
  .qr-block{ display:flex; align-items:center; gap:14px; flex-shrink:0; }
  .title-block{ flex:1; min-width:0; }
  header h1{ margin:0; font-size:2vw; font-weight:600; letter-spacing:0.3px; }
  header .sub{ font-size:1.1vw; color:#CBA9B2; margin-top:4px; }
  header .updated{ font-size:1vw; color:#AEB8B2; text-align:right; white-space:nowrap; flex-shrink:0; }
  header .updated .dot{
    display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--win);
    margin-right:6px; animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }

  .qr-badge{
    position:relative; width:clamp(96px, 8.5vw, 150px); aspect-ratio:1;
    flex-shrink:0; border-radius:50%;
    animation:qrPulseRing 2.4s ease-in-out infinite;
  }
  @keyframes qrPulseRing{
    0%,100%{ box-shadow:0 0 0 0 rgba(232,116,158,0.55); }
    50%{ box-shadow:0 0 0 14px rgba(232,116,158,0); }
  }
  .qr-badge svg{ position:absolute; inset:0; width:100%; height:100%; }
  .qr-badge .qr-code-wrap{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:62%; height:62%; background:#fff; border-radius:8px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,0.3);
  }
  .qr-badge .qr-code-wrap img, .qr-badge .qr-code-wrap canvas, .qr-badge .qr-code-wrap table{
    width:100% !important; height:100% !important;
  }
  .qr-label-main{ font-size:1.15vw; font-weight:700; color:var(--gold); letter-spacing:0.4px; white-space:nowrap; }
  .qr-label-sub{ font-size:0.85vw; color:#CBA9B2; white-space:nowrap; }

  main{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px;
    padding:18px 18px 0 18px; flex:1; min-height:0; overflow:hidden;
  }

  .pool-col{
    background:var(--card); border-radius:14px; border:1px solid var(--line);
    display:flex; flex-direction:column; overflow:hidden; height:100%;
  }
  .pool-head{
    background:var(--navy); color:#fff; padding:14px 20px;
    display:flex; justify-content:space-between; align-items:center; flex-shrink:0;
  }
  .pool-head .pool-name{ font-size:1.6vw; font-weight:600; }
  .pool-head .court-tag{ font-size:1vw; font-weight:700; }

  .matches{ padding:8px 16px; flex-shrink:0; }
  .match-row{
    display:grid; grid-template-columns:auto 1fr auto; align-items:center;
    gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:1.15vw;
  }
  .match-row:last-child{ border-bottom:none; }
  .match-row .rd{ font-family:'Oswald'; color:var(--sub); font-size:0.9vw; width:2.2vw; }
  .match-row .teams{ font-weight:600; overflow:hidden; }
  .match-row .teams .vs{ color:var(--sub); font-weight:400; font-size:0.9vw; padding:0 6px; }
  .match-row .teams .work{ font-weight:400; font-style:italic; color:var(--sub); font-size:0.8vw; margin-top:2px; }
  .status{
    font-size:0.85vw; font-weight:700; padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .status.win{ background:#E1F5F1; color:var(--win); }
  .status.pending{ background:#EEF0F0; color:var(--pending); }
  .status.live{ background:#FCE9E9; color:#C0392B; animation:pulse 1.6s ease-in-out infinite; }
  .score{ font-family:'Oswald'; font-size:0.85vw; color:var(--sub); }

  .standings-wrap{ padding:10px 16px 16px 16px; flex:1; overflow:hidden; }
  table.standings{ width:100%; border-collapse:collapse; }
  table.standings th{
    text-align:center; font-size:0.85vw; text-transform:uppercase; letter-spacing:0.3px;
    color:var(--sub); padding:6px 4px; border-bottom:2px solid var(--line);
  }
  table.standings th:first-child{ text-align:left; }
  table.standings td{
    text-align:center; font-family:'Oswald'; font-size:1.2vw; padding:8px 4px;
    border-bottom:1px solid var(--line);
  }
  table.standings tr:last-child td{ border-bottom:none; }
  table.standings td.team-cell{ text-align:left; font-family:'Inter'; font-weight:600; }
  .rank-badge{
    display:inline-block; width:1.6vw; height:1.6vw; line-height:1.6vw; border-radius:50%;
    background:var(--navy); color:#fff; font-size:0.9vw; text-align:center; margin-right:8px;
    font-family:'Inter'; font-weight:700;
  }
  .rank-badge.silver{ background:#A0778A; }
</style>
</head>
<body>

<header>
  <div class="qr-block">
    <div class="qr-badge">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="47" fill="#fff" stroke="#E8749E" stroke-width="3"/>
        <path d="M50,4 C24,22 24,78 50,96" fill="none" stroke="#E8749E" stroke-width="2.5"/>
        <path d="M50,4 C76,22 76,78 50,96" fill="none" stroke="#E8749E" stroke-width="2.5"/>
        <path d="M4,50 C28,37 72,37 96,50" fill="none" stroke="#E8749E" stroke-width="2.5"/>
        <path d="M4,50 C28,63 72,63 96,50" fill="none" stroke="#E8749E" stroke-width="2.5"/>
      </svg>
      <div class="qr-code-wrap" id="qrCode"></div>
    </div>
    <div>
      <div class="qr-label-main">SCAN ME</div>
      <div class="qr-label-sub">for live scores</div>
    </div>
  </div>
  <div class="title-block">
    <h1>Sophie Montez Memorial Tournament</h1>
    <div class="sub">Live Pool Play</div>
  </div>
  <div class="updated"><span class="dot"></span><span id="updatedText">Loading&hellip;</span></div>
</header>

<main id="poolsGrid"></main>

<script>
const POOLS = [
  { key:'A', court:1, teams:['Estacada','South Umpqua','Banks','Gladstone'] },
  { key:'B', court:2, teams:['Scappoose','Madras','Philomath','La Pine'] },
  { key:'C', court:3, teams:['Ontario','Junction City','Molalla','Astoria'] }
];
const ROUND_PATTERN = [[0,3],[1,2],[0,2],[1,3],[0,1],[2,3]];
const WORK_PATTERN = [1,0,1,2,3,0];
const COURT_NAMES = { 1:'EHS Main Gym', 2:'EHS Aux Gym', 3:'River Mill Gym' };
const COURT_COLORS = { 1:'#E8749E', 2:'#1D9A8C', 3:'#8B5FBF' };
function courtLabel(n, upper){
  const text = upper ? COURT_NAMES[n].toUpperCase() : COURT_NAMES[n];
  return '<span style="color:'+COURT_COLORS[n]+'">'+text+'</span>';
}

let state = { matches:{} };

function ensureMatch(pool,round){
  const k = pool+'-r'+round;
  if(!state.matches[k]) state.matches[k] = { sets:[{a:null,b:null}], live:false };
  return state.matches[k];
}

function computeMatchResult(m, teamA, teamB){
  let setsA=0,setsB=0,ptsA=0,ptsB=0;
  (m.sets||[]).forEach(s=>{
    if(s.a!=null && s.b!=null && !isNaN(s.a) && !isNaN(s.b) && (s.a>0||s.b>0)){
      ptsA+=Number(s.a); ptsB+=Number(s.b);
      if(s.a>s.b) setsA++; else if(s.b>s.a) setsB++;
    }
  });
  let winner=null;
  if(setsA>setsB) winner=teamA; else if(setsB>setsA) winner=teamB;
  return { setsA,setsB,ptsA,ptsB,winner,played: winner!==null };
}
function scoreLineText(m){
  return (m.sets||[])
    .filter(s=> s.a!=null && s.b!=null && !isNaN(s.a) && !isNaN(s.b) && (s.a>0||s.b>0))
    .map(s=> s.a+'-'+s.b)
    .join(', ');
}

function poolStandings(pool){
  const stats = {};
  pool.teams.forEach(t=> stats[t] = { team:t, wins:0, losses:0, setsW:0, setsL:0, ptsW:0, ptsL:0, h2h:{} });
  ROUND_PATTERN.forEach((pair, idx)=>{
    const round = idx+1;
    const teamA = pool.teams[pair[0]], teamB = pool.teams[pair[1]];
    const m = ensureMatch(pool.key, round);
    const r = computeMatchResult(m, teamA, teamB);
    stats[teamA].setsW += r.setsA; stats[teamA].setsL += r.setsB;
    stats[teamA].ptsW += r.ptsA; stats[teamA].ptsL += r.ptsB;
    stats[teamB].setsW += r.setsB; stats[teamB].setsL += r.setsA;
    stats[teamB].ptsW += r.ptsB; stats[teamB].ptsL += r.ptsA;
    if(r.played){
      if(r.winner===teamA){ stats[teamA].wins++; stats[teamB].losses++; stats[teamA].h2h[teamB]='W'; stats[teamB].h2h[teamA]='L'; }
      else { stats[teamB].wins++; stats[teamA].losses++; stats[teamB].h2h[teamA]='W'; stats[teamA].h2h[teamB]='L'; }
    }
  });
  const arr = Object.values(stats).map(s=>({
    ...s,
    setPct: (s.setsW+s.setsL)>0 ? s.setsW/(s.setsW+s.setsL) : 0,
    ptPct: (s.ptsW+s.ptsL)>0 ? s.ptsW/(s.ptsW+s.ptsL) : 0
  }));
  arr.sort((a,b)=> b.wins-a.wins || b.setPct-a.setPct || b.ptPct-a.ptPct);
  for(let i=0;i<arr.length-1;i++){
    let j=i;
    while(j+1<arr.length && arr[j+1].wins===arr[i].wins) j++;
    if(j===i+1){
      const a=arr[i], b=arr[j];
      if(a.h2h[b.team]==='L' && b.h2h[a.team]==='W'){ arr[i]=b; arr[j]=a; }
    }
  }
  arr.forEach((s,i)=> s.rank = i+1);
  return arr;
}

function renderPoolColumn(pool){
  const standings = poolStandings(pool);
  let html = '<div class="pool-col">';
  html += '<div class="pool-head"><span class="pool-name">Pool '+pool.key+'</span><span class="court-tag">'+courtLabel(pool.court, true)+'</span></div>';

  html += '<div class="matches">';
  ROUND_PATTERN.forEach((pair, idx)=>{
    const round = idx+1;
    const teamA = pool.teams[pair[0]], teamB = pool.teams[pair[1]];
    const m = ensureMatch(pool.key, round);
    const r = computeMatchResult(m, teamA, teamB);
    const workTeam = pool.teams[WORK_PATTERN[idx]];
    const courtColor = COURT_COLORS[pool.court];
    let statusHtml;
    if(r.played){
      const record = r.winner===teamA ? r.setsA+'-'+r.setsB : r.setsB+'-'+r.setsA;
      statusHtml = '<span class="status win">'+record+'</span>';
      if(scoreLineText(m)) statusHtml += '<div class="score">'+scoreLineText(m)+'</div>';
    } else if(m.live){
      statusHtml = '<span class="status live">LIVE</span>';
    } else {
      statusHtml = '<span class="status pending">Not played</span>';
    }
    const teamAHtml = (r.played && r.winner===teamA) ? '<span style="color:'+courtColor+'">'+teamA+'</span>' : teamA;
    const teamBHtml = (r.played && r.winner===teamB) ? '<span style="color:'+courtColor+'">'+teamB+'</span>' : teamB;
    html += '<div class="match-row"><span class="rd">R'+round+'</span>'+
      '<span class="teams">'+teamAHtml+'<span class="vs">vs</span>'+teamBHtml+'<div class="work">Work Team: '+workTeam+'</div></span>'+
      '<span style="text-align:right">'+statusHtml+'</span></div>';
  });
  html += '</div>';

  html += '<div class="standings-wrap"><table class="standings"><thead><tr><th>Team</th><th>W-L</th><th>Set%</th><th>Pt%</th></tr></thead><tbody>';
  standings.forEach(s=>{
    html += '<tr><td class="team-cell"><span class="rank-badge'+(s.rank>2?' silver':'')+'">'+s.rank+'</span>'+s.team+'</td>'+
      '<td>'+s.wins+'-'+s.losses+'</td>'+
      '<td>'+(s.setPct*100).toFixed(0)+'%</td>'+
      '<td>'+(s.ptPct*100).toFixed(0)+'%</td></tr>';
  });
  html += '</tbody></table></div>';

  html += '</div>';
  return html;
}

function render(){
  document.getElementById('poolsGrid').innerHTML = POOLS.map(renderPoolColumn).join('');
}

function setUpdatedNow(){
  const el = document.getElementById('updatedText');
  const now = new Date();
  el.textContent = 'Updated ' + now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

let lastSnapshot = null;
async function pollData(){
  try{
    const res = await window.storage.get('tournament-data', true);
    if(res && res.value && res.value !== lastSnapshot){
      lastSnapshot = res.value;
      const parsed = JSON.parse(res.value);
      if(parsed.matches) state.matches = parsed.matches;
      render();
    }
    setUpdatedNow();
  }catch(e){ /* keep showing the last good data */ }
}

new QRCode(document.getElementById('qrCode'), {
  text: 'https://ehsvball.netlify.app/',
  width: 200,
  height: 200,
  colorDark: '#E8749E',
  colorLight: '#ffffff',
  correctLevel: QRCode.CorrectLevel.H
});

(async function init(){
  render();
  await pollData();
  setInterval(pollData, 5000);
})();
</script>
</body>
</html>
